<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Abstract temporal data network</title>
  <desc id="bannerDesc">A quiet, minimal scientific illustration of connected points arranged along a flowing timeline.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="0.52" stop-color="#101e31"/>
      <stop offset="1" stop-color="#0a1929"/>
    </linearGradient>
    <radialGradient id="ambientA"><stop offset="0" stop-color="#2c8d96" stop-opacity=".22"/><stop offset="1" stop-color="#2c8d96" stop-opacity="0"/></radialGradient>
    <radialGradient id="ambientB"><stop offset="0" stop-color="#7770c9" stop-opacity=".18"/><stop offset="1" stop-color="#7770c9" stop-opacity="0"/></radialGradient>
    <linearGradient id="timeline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fc6bb" stop-opacity=".12"/><stop offset=".3" stop-color="#72c9c4" stop-opacity=".78"/><stop offset=".7" stop-color="#9d9ae5" stop-opacity=".82"/><stop offset="1" stop-color="#9d9ae5" stop-opacity=".12"/>
    </linearGradient>
