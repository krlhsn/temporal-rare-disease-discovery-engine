<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">TRDDE — Temporal Rare-Disease Discovery Engine</title>
  <desc id="desc">A minimal scientific banner with a luminous DNA helix, orbital arcs, and the TRDDE project title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.55" stop-color="#071b3a"/>
      <stop offset="1" stop-color="#031026"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45e7ff"/>
      <stop offset="0.52" stop-color="#16b8ff"/>
      <stop offset="1" stop-color="#6b74ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cff" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#59dfff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#0875d1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0875d1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#3a91d8" opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#dots)"/>
  <ellipse cx="900" cy="205" rx="330" ry="255" fill="url(#halo)"/>
  <g fill="none" stroke="#2786d2" opacity="0.27">
    <path d="M0 85 L95 30 L190 85 L285 30"/>
    <path d="M930 0 L1020 55 L1110 0 L1200 55"/>
    <path d="M1000 420 L1090 365 L1180 420"/>
    <path d="M30 345 L120 290 L210 345"/>
  </g>
  <g fill="#42cfff" opacity="0.6">
    <circle cx="95" cy="30" r="4"/><circle cx="190" cy="85" r="3"/><circle cx="1020" cy="55" r="4"/>
    <circle cx="1110" cy="0" r="3"/><circle cx="1090" cy="365" r="4"/><circle cx="120" cy="290" r="3"/>
  </g>
  <g transform="translate(850 207)" fill="none" stroke-linecap="round">
    <circle r="172" stroke="#187bd2" stroke-width="1.6" opacity="0.42"/>
    <circle r="145" stroke="#40d9ff" stroke-width="1.2" stroke-dasharray="2 13" opacity="0.55"/>
    <ellipse rx="205" ry="86" stroke="#347de0" stroke-width="2" opacity="0.45" transform="rotate(-28)"/>
    <ellipse rx="205" ry="86" stroke="#8a79ff" stroke-width="1.5" opacity="0.3" transform="rotate(34)"/>
    <g filter="url(#glow)" stroke="url(#cyan)" stroke-width="8">
      <path d="M-48 -145 C105 -75 105 -8 -48 62 C-120 96 -120 145 -20 174"/>
      <path d="M48 -145 C-105 -75 -105 -8 48 62 C120 96 120 145 20 174"/>
    </g>
    <g stroke="#4edfff" stroke-width="5" opacity="0.9">
      <path d="M-42 -119 L42 -119 M-68 -84 L68 -84 M-81 -48 L81 -48 M-78 -12 L78 -12 M-57 25 L57 25 M-23 61 L23 61 M-7 98 L7 98 M-1 134 L1 134"/>
    </g>
    <g fill="#65eaff" stroke="none" filter="url(#glow)">
      <circle cx="-48" cy="-145" r="5"/><circle cx="48" cy="-145" r="5"/><circle cx="0" cy="0" r="4"/>
    </g>
  </g>
  <g transform="translate(78 86)">
    <text x="0" y="0" fill="#f4fbff" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" letter-spacing="7">TRDDE</text>
    <path d="M4 34 H570" stroke="url(#cyan)" stroke-width="3"/>
    <text x="4" y="88" fill="#e9f5ff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" letter-spacing="2">TEMPORAL RARE-DISEASE</text>
    <text x="4" y="126" fill="#e9f5ff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" letter-spacing="2">DISCOVERY ENGINE</text>
    <text x="5" y="183" fill="#78dfff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-style="italic" letter-spacing="1">Find patterns. Ask better questions.</text>
    <g transform="translate(6 240)" fill="none" stroke="#49dfff" stroke-width="2" opacity="0.85">
      <circle cx="11" cy="0" r="5"/><circle cx="52" cy="0" r="5"/><circle cx="93" cy="0" r="5"/>
      <path d="M16 0 H47 M57 0 H88"/>
    </g>
    <text x="5" y="284" fill="#a9bfd9" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="1">SYNTHETIC DATA  ·  EXPLORATORY METHODS  ·  PYTHON</text>
  </g>
  <path d="M55 382 H1145" stroke="#2b85d0" stroke-width="1" opacity="0.35"/>
  <text x="600" y="405" fill="#8fa8c8" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">EDUCATIONAL RESEARCH PROTOTYPE  •  NOT A DIAGNOSTIC TOOL</text>
</svg>
