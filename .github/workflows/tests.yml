name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate the built-in dataset
        run: python main.py --validate

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Verify JSON report export
        run: |
          python main.py --export /tmp/trdde-report.json
          python -m json.tool /tmp/trdde-report.json > /dev/null
